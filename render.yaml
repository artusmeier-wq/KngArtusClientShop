# Kostenlose Testversion; KEIN persistenter Dateispeicher.
# Bei Neustart/Neudeploy können Keys, Freigaben und JAR verloren gehen.
services:
  - type: web
    name: kngartusclient-shop
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: ADMIN_PASSWORD
        sync: false
